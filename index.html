<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart City 3D</title>
    <meta
      name="description"
      content="Smart City 3D — AI-Powered Smart Flood Management, 3D Urban Infrastructure Simulation, and Intelligent Route Optimization for Chatuchak District."
    />
    <meta property="og:title" content="Smart City 3D" />
    <meta
      property="og:description"
      content="Smart City 3D — AI-Powered Smart Flood Management, 3D Urban Infrastructure Simulation, and Intelligent Route Optimization for Chatuchak District."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem('urbanguard-theme');
          var mode = stored === 'light' ? 'light' : 'dark';
          var root = document.documentElement;
          root.classList.toggle('dark', mode === 'dark');
          root.classList.toggle('light', mode === 'light');
          root.style.colorScheme = mode;
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F4F7FB] text-[#172033] dark:bg-[#060b14] dark:text-slate-100 antialiased selection:bg-cyan-500/25 selection:text-cyan-950 dark:selection:text-cyan-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
